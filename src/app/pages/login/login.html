<div class="login-container">

  <div class="login-card">

    <h1>Login</h1>

    <form (ngSubmit)="login()">

      <input
        type="email"
        placeholder="Email"
        [(ngModel)]="email"
        name="email">

      <input
        type="password"
        placeholder="Password"
        [(ngModel)]="password"
        name="password">

      <button type="submit">
        Login
      </button>

    </form>

    <a routerLink="/register" class="register-link">
      Create Account
    </a>

  </div>

</div>
